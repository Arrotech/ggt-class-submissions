<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{% block title %}SQL Power Hour{% endblock %}</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-icon" aria-hidden="true">SQL</span>
        <span>SQL Power Hour</span>
      </a>
      {% if username %}
      <div class="user-menu">
        <span class="user-label">Signed in as <strong>{{ username }}</strong></span>
        <form action="/logout" method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button class="button button-quiet button-small" type="submit">Sign out</button>
        </form>
      </div>
      {% endif %}
    </header>
    <main class="page">
      {% if error %}
      <div class="notice notice-error" role="alert">{{ error }}</div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
    <footer class="footer">A focused hour. A stronger SQL habit.</footer>
    {% block scripts %}{% endblock %}
  </body>
</html>
